name: CI

on:
  push:
  pull_request:

jobs:
  root-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # integrity-sdk is not published; pyproject resolves it from the sibling
      # integrity-core checkout (tool.uv.sources), which plain pip ignores. Check it out
      # inside the workspace (actions/checkout rejects ../ paths) at a pinned ref and
      # install it before Shield. Bump the ref deliberately when SDK changes are needed.
      - name: Checkout integrity-core (integrity-sdk dependency)
        uses: actions/checkout@v4
        with:
          repository: XibalbaTechSol/integrity-core
          # integrity-core main after #171 merged (2026-10-11). Bumped for integrity-core#171, which adds
          # integrity-sdk/tests/conformance/decision_vectors.json (the shared decision vectors that
          # tests/test_decision_vectors.py runs). Earlier bumps: #169 added
          # integrity_sdk.core.receipt_writer (shield/gate_receipts.py wraps it). The #162 pin already
          # carried #161's integrity_sdk.did migration fix and #162's additive
          # integrity_sdk.hook_runner module, and this one includes both. Bump this ref deliberately, in the SAME PR
          # as any code that imports a newly added SDK symbol -- never in a follow-up.
          # Landing the two out of order is what broke main's CI on 2026-10-05 in both
          # this repo and its sibling; see the A0 precondition in integrity-core's
          # docs/EXECUTION_PLAN.md.
          ref: 7cd86197ccbe34171781ecdff77201179e8a8144
          path: integrity-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OPA
        run: |
          curl --fail --location -o opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          echo "9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8  opa" | sha256sum --check -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
      - name: Install package
        run: |
          python -m pip install -e ./integrity-core/integrity-sdk
          python -m pip install -e ".[dev]"
      - name: Run root-free tests
        # Explicit path: the integrity-core checkout above must not be collected.
        run: pytest -q tests
      - name: Verify packaged local OPA profiles
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          wheel_paths=(dist/xibalba_shield-*.whl)
          wheel_path="${wheel_paths[0]}"
          test -f "$wheel_path"
          rm -rf /tmp/shield-wheel-smoke
          python -m pip install --no-deps --target /tmp/shield-wheel-smoke "$wheel_path"
          cd /tmp
          PYTHONPATH=/tmp/shield-wheel-smoke python -m shield.cli local-run --profile smb --opa-binary /usr/local/bin/opa --max-events 1 --dev-interval 0 --log-path /tmp/shield-wheel-smoke.jsonl
      - name: Validate default policy packs
        run: |
          shield validate --rules policies/defaults/smb.json
          shield validate --rules policies/defaults/professional-services.json
          shield validate --rules policies/defaults/regulated.json
