[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xibalba-shield"
version = "0.0.1"
description = "Endpoint agent for AI-agent discovery, constraint, and Integrity-backed evidence — device/network security, separate from the Integrity Health (HIPAA) vertical. Core (schemas, policy engine, agent core, guardrail hooks, exporter, CLI) is real and tested; 2 of 3 Linux eBPF sensors verified. See README.md for current status against spec/xibalba-shield-v1.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Xibalba Solutions" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # One-way dependency on integrity-sdk (protocol spec §14.1), imported the same way any
    # third-party agent runtime would use it -- no privileged API, no special-cased access.
    # Git subdirectory dependency keeps clean CI runners independent of a sibling checkout.
    # Immutable cross-repository pin: this revision signs invocation_id into BCC commitments.
    # Advance only after the corresponding Integrity Protocol contract and evidence gates pass.
    # Bumped 2026-09-14: adds integrity_sdk.agent_identity (needed by this repo's device
    # identity-resolution code) and moves canonical BCC signing from json.dumps(sort_keys=True)
    # to RFC 8785 JCS. Verified JCS-compatible against the live bcc-middleware/oracle deployment
    # before bumping (a throwaway JCS-signed commitment round-tripped with authorized: True, no
    # signature error) -- see this repo's handoff doc for the verification record. Pinned to
    # 7a1f9c0 rather than an earlier commit because agent_identity.py does not exist before it;
    # that commit also carries unrelated same-night dashboard/userapi work bundled in the same
    # push, which is a known, accepted wart here, not an oversight.
    "integrity-sdk @ git+https://github.com/XibalbaTechSol/integrity-core.git@7a1f9c0722a2147da5df73664e437def5d25801c#subdirectory=integrity-sdk",
    "mlflow>=3.15.1",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
shield = "shield.cli:main"
shield-backend = "shield.backend.api:main"
shield-cortex-outbox = "shield.cortex_outbox_worker:main"

[tool.setuptools.packages.find]
include = ["shield*"]

[tool.setuptools.package-data]
shield = ["policies/rego/*.rego", "sensors/ebpf/*.bpf.c"]
