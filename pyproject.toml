[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xibalba-shield"
version = "0.0.1"
description = "Endpoint agent for AI-agent discovery, constraint, and Integrity-backed evidence — device/network security, separate from the Integrity Health (HIPAA) vertical. Core (schemas, policy engine, agent core, guardrail hooks, exporter, CLI) is real and tested; 2 of 3 Linux eBPF sensors verified. See README.md for current status against spec/xibalba-shield-v1.md."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Xibalba Solutions" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # One-way dependency on integrity-sdk (protocol spec §14.1), imported the same way any
    # third-party agent runtime would use it -- no privileged API, no special-cased access.
    # Local-first authority: uv resolves this to the sibling Integrity-core checkout below.
    # Shield and Cortex must consume the same newest SDK tree as the Core workspace.
    # `[connector]` (docs/EXECUTION_PLAN.md A2/A3): Shield uses did/agent_identity/client/bcc/
    # telemetry.tracing, none of which are in the dependency-light SDK core -- explicitly
    # requesting the extra is what lets the SDK drop these from its own base `dependencies`.
    "integrity-sdk[connector]",
    # shield/opa_client.py's own direct dependency (it no longer imports the SDK's async
    # OPA client, which the SDK's Phase A1 restructure removed -- see that module's docstring).
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pyjwt[crypto]>=2.13.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
shield = "shield.cli:main"
shield-backend = "shield.backend.api:main"
shield-cortex-outbox = "shield.cortex_outbox_worker:main"

[tool.setuptools.packages.find]
include = ["shield*"]

[tool.uv.sources]
integrity-sdk = { path = "../integrity-core/integrity-sdk", editable = true }

[tool.setuptools.package-data]
shield = ["policies/rego/*.rego", "sensors/ebpf/*.bpf.c", "schemas/*.json"]
