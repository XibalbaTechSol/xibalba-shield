services:
  - type: web
    name: xibalba-shield
    runtime: python
    buildCommand: git clone --depth 1 https://github.com/XibalbaTechSol/integrity-core.git ../integrity-core && pip install --upgrade uv && uv sync --no-editable && (cd ui && npm ci && npm run build)
    startCommand: uv run shield-backend --host 0.0.0.0
    healthCheckPath: /api/shield/health
    region: oregon
    plan: free
    autoDeploy: true
    envVars:
      - key: HOST
        value: "0.0.0.0"
      # The build installs the package with `uv sync --no-editable`, so shield/backend/api.py
      # ends up in site-packages and cannot find ui/dist by walking up from itself. Point at
      # the checkout explicitly, or the backend silently serves its built-in fallback console.
      - key: SHIELD_UI_DIR
        value: /opt/render/project/src/ui/dist
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OIDC_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SHIELD_BACKEND_TOKEN
        generateValue: true
      - key: SHIELD_PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: XIBALBA_CORTEX_URL
        sync: false
      # Device entitlement signer (Ed25519 PKCS#8 PEM). Unset: no entitlement is issued and every
      # gate stays in shadow. Operator-set in the dashboard; never generateValue (it must be a key).
      - key: SHIELD_ENTITLEMENT_SIGNING_KEY
        sync: false
      # Stripe billing (phase 3c). Any of these unset or placeholder: checkout answers 503 and no
      # tenant plan ever changes. Price ids are validated against the plan catalog on every checkout.
      - key: SHIELD_STRIPE_SECRET_KEY
        sync: false
      - key: SHIELD_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHIELD_STRIPE_METER_ID
        sync: false
      - key: SHIELD_STRIPE_PRICE_PRO_DEVICE
        sync: false
      - key: SHIELD_STRIPE_PRICE_PRO_OVERAGE
        sync: false
      - key: SHIELD_STRIPE_PRICE_TEAM_DEVICE
        sync: false
      - key: SHIELD_STRIPE_PRICE_TEAM_OVERAGE
        sync: false
      - key: SHIELD_STRIPE_PORTAL_CONFIGURATION
        sync: false
