[package]
name = "device-core"
version = "0.1.0"
edition = "2021"
description = "Reads Shield's local decision and outcome logs and derives what is frozen. No GUI dependency."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
